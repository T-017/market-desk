<!DOCTYPE html>
<html lang="en-US">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markets catalog | Market Desk</title>
  <meta name="description" content="Filter and inspect a curated catalog of global issuers with end-of-day quotes.">
  <meta name="author" content="J. Toshio Holt">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/config.js" defer></script>
  <script type="module" src="js/main.js"></script>
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <img src="images/logo.svg" width="36" height="36" alt="">
        <span>Market Desk</span>
      </a>
      <div class="header-actions">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false">Light mode</button>
      </div>
      <button class="nav-toggle" id="nav-toggle" type="button" aria-label="Menu" aria-expanded="false"
        aria-controls="site-nav">
        <span></span><span></span><span></span>
      </button>
      <nav class="site-nav" id="site-nav" aria-label="Primary">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="markets.html" class="is-current">Markets</a></li>
          <li><a href="index.html#converter">Convert</a></li>
          <li><a href="about.html">About</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="wrap">
    <header class="section-head">
      <div>
        <p class="kicker">Marketstack EOD</p>
        <h1>Issuer catalog</h1>
        <p class="lede">
          Ten liquid names across technology, energy, healthcare, and retail.
          Search by ticker, sector, or country. Click a card to flip it.
        </p>
      </div>
    </header>

    <div class="panel" style="margin-bottom: 1.25rem;">
      <label class="field">
        <span>Search tickers</span>
        <input id="ticker-search" type="search" placeholder="AAPL, Tokyo, Healthcare…" autocomplete="off">
      </label>
      <div class="chip-row" id="sector-filters" style="margin-top: 0.9rem;"></div>
    </div>

    <div class="card-grid" id="catalog-grid" aria-live="polite"></div>

    <aside class="panel" id="watch" style="margin-top: 1.5rem;">
      <h2>Watchlist</h2>
      <ul class="watch-list" id="watchlist"></ul>
    </aside>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>&copy; <span id="year"></span> Market Desk.</p>
      <p><a href="about.html">How the data works</a></p>
    </div>
  </footer>
  <div id="toast-host" aria-live="polite"></div>
</body>

</html>
